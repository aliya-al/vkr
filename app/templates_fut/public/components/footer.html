{# templates/public/components/footer.html #}

<footer class="site-footer" role="contentinfo">
  <div class="container footer__inner">
    <div class="footer__col">
      <div class="footer__title">Контактная информация</div>
      <div class="footer__text">
        {{ footer_address|default('г. Казань, ул. Примерная, 1') }}
      </div>
      <a class="footer__link" href="tel:{{ phone|default('+7 (000) 000-00-00')|replace(' ', '') }}">
        {{ phone|default('+7 (000) 000-00-00') }}
      </a>
    </div>

    <div class="footer__col">
      <div class="footer__title">Информация</div>
      <a class="footer__link" href="/delivery">Доставка</a>
      <a class="footer__link" href="/about">О компании</a>
      <a class="footer__link" href="/contacts">Контакты</a>
    </div>

    <div class="footer__col footer__col--right">
      <div class="footer__copy">© {{ year|default(2026) }}. Все права защищены.</div>
    </div>
  </div>
</footer>
