<div class="cookie-consent" id="cookieConsent" hidden role="region" aria-label="Баннер согласия на cookie">
  <div class="cookie-consent__content">
    <p class="cookie-consent__text" id="cookieConsentText">
      Мы используем
      <button
        type="button"
        class="cookie-consent__toggle"
        id="cookieConsentToggle"
        aria-expanded="false"
        aria-controls="cookieConsentDetails"
      >cookie</button>
      <span class="cookie-consent__details" id="cookieConsentDetails">
        . Это позволяет нам делать ваше пребывание на сайте удобным. Продолжая пользоваться сайтом, вы соглашаетесь с использованием файлов cookie.
      </span>
    </p>
    <button type="button" class="cookie-consent__accept" id="cookieConsentAccept">Принять</button>
  </div>
</div>
