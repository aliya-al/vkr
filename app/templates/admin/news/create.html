<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Создать новость</title>
</head>
<body>
  <h1>Создать новость</h1>

  {% if error %}
    <p style="color:red;">{{ error }}</p>
  {% endif %}

  <form method="post" action="/admin/news/new" enctype="multipart/form-data">
    <div>
      <label>Название
        <input type="text" name="title" required>
      </label>
    </div>

    <div>
      <label>Описание</label><br>
      <textarea name="description" rows="5" cols="50" required></textarea>
    </div>

    <div>
      <label>Фото
        <input type="file" name="image" accept="image/*">
      </label>
    </div>

    <button type="submit">Сохранить</button>
  </form>

  <p><a href="/admin/news">Назад</a></p>
</body>
</html>
