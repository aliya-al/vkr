{% extends "admin/base.html" %}

{% block title %}Создать новость{% endblock %}

{% block head %}
  <link rel="stylesheet" href="/static/css/admin/entity_pages.css">
  <link rel="stylesheet" href="/static/css/admin/products_create.css">
{% endblock %}



{% block content %}
<div class="admin-newsForm">
  <div class="container">
    <div class="pc-narrow">

      <div class="pc-top">
        <div class="pc-title">Создать новость</div>
      </div>

      {% if error %}
        <div class="pc-alert" role="alert">
          <strong class="pc-alert__label">Ошибка:</strong>
          <span class="pc-alert__text">{{ error }}</span>
        </div>
      {% endif %}

      <section class="pc-card" aria-label="Форма новости">

        <form method="post" action="/admin/news/new" enctype="multipart/form-data" class="pc-form">

          <div class="pc-section">
            <div class="pc-fields pc-fields--2">

              <div class="pc-field nf-fieldWide">
                <label class="pc-label" for="newsTitle">Название</label>
                <input id="newsTitle" class="pc-input" type="text" name="title" required maxlength="30" value="{{ form_data.title if form_data else '' }}">
              </div>

              <div class="pc-field nf-fieldWide">
                <label class="pc-label" for="newsImg">Фото</label>
                <input id="newsImg" class="pc-input" type="file" name="image" accept="image/*" required>
              </div>

            </div>
          </div>

          <div class="pc-actions pc-actions--form">

            <button class="pc-btn pc-btn--primary" type="submit">Сохранить</button>
            <a class="pc-btn pc-btn--ghost" href="/admin/news">Отмена</a>
          </div>

        </form>
      </section>

    </div>
  </div>
</div>
{% endblock %}
