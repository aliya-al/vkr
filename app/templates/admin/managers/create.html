{% extends "admin/base.html" %}

{% block title %}Создать менеджера{% endblock %}

{% block head %}
  <link rel="stylesheet" href="/static/css/admin/entity_pages.css">
{% endblock %}

{% block content %}
<div class="admin-managerForm">
  <div class="container">
    <div class="pc-narrow">

      <div class="pc-top">
        <h1 class="pc-title">Создать менеджера</h1>
        <div class="pc-actions">
          <a class="pc-btn pc-btn--ghost" href="/admin/managers">Назад</a>
        </div>
      </div>

      {% if error %}
        <div class="pc-alert" role="alert">
          <strong class="pc-alert__label">Ошибка:</strong>
          <span class="pc-alert__text">{{ error }}</span>
        </div>
      {% endif %}

      <section class="pc-card" aria-label="Форма создания менеджера">
        <form class="pc-form" method="post" action="/admin/managers/new">
          <div class="pc-section">
            <div class="pc-fields pc-fields--2">
              <div class="pc-field">
                <label class="pc-label" for="mgLogin">Менеджер</label>
                <input id="mgLogin" class="pc-input" type="text" name="login" value="{{ login }}" required maxlength="15">
              </div>

              <div class="pc-field">
  <label class="pc-label" for="mgPassword">Пароль</label>

  <div class="pc-pass">
    <input
      id="mgPassword"
      class="pc-input pc-pass__input"
      type="password"
      name="password"
      required
      autocomplete="new-password"
      spellcheck="false"
    >
    <button class="pc-btn pc-btn--sm pc-pass__toggle" type="button" data-pass-toggle="mgPassword">
      Показать
    </button>
  </div>
</div>


              <div class="pc-field nf-fieldWide">
                <label class="pc-check">
                  <input type="checkbox" name="is_active" value="true" {% if is_active %}checked{% endif %}>
                  Активен
                </label>
              </div>
            </div>

            <div class="pc-actions pc-actions--form">
              <a class="pc-btn pc-btn--ghost" href="/admin/managers">Отмена</a>
              <button class="pc-btn pc-btn--primary" type="submit">Сохранить</button>
            </div>
          </div>
        </form>
      </section>

    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function(){
  document.addEventListener("click", function(e){
    const btn = e.target.closest("[data-pass-toggle]");
    if(!btn) return;

    const id = btn.getAttribute("data-pass-toggle");
    const input = document.getElementById(id);
    if(!input) return;

    const isPass = input.type === "password";
    input.type = isPass ? "text" : "password";
    btn.textContent = isPass ? "Скрыть" : "Показать";
    input.focus();
  });
})();
</script>
{% endblock %}
