<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Редактировать менеджера</title>
</head>
<body>
  <h1>Редактировать менеджера</h1>

  {% if error %}
    <p style="color:red;">{{ error }}</p>
  {% endif %}

  <form method="post" action="/admin/managers/{{ manager.id }}/edit">
    <div>
      <label>Логин
        <input type="text" name="login" value="{{ manager.login }}" required>
      </label>
    </div>

    <div>
      <label>Новый пароль (если нужно сменить)
        <input type="password" name="password" placeholder="новый пароль">
      </label>
    </div>

    <div>
      <label>
        <input type="checkbox" name="is_active" value="true" {% if manager.is_active %}checked{% endif %}>
        Активен
      </label>
    </div>

    <button type="submit">Сохранить</button>
  </form>

  <p><a href="/admin/managers">Назад</a></p>
</body>
</html>
