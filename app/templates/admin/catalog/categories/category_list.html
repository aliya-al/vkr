<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Категории</title>
</head>
<body>
  <h1>Категории</h1>
  <a href="/admin/catalog/categories/create">Создать категорию</a>
  <table border="1" cellpadding="4">
    <thead>
      <tr>
        <th>Название</th>
        <th>Slug</th>
        <th>Родитель</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody>
    {% for category in categories %}
      <tr>
        <td>{{ category.name }}</td>
        <td>{{ category.slug }}</td>
        <td>{% if category.parent %}{{ category.parent.name }}{% else %}—{% endif %}</td>
        <td>
          <a href="/admin/catalog/categories/{{ category.id }}/edit">Редактировать</a>
          <form method="post" action="/admin/catalog/categories/{{ category.id }}/delete" style="display:inline;">
            <button type="submit">Удалить</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  <p><a href="/admin/">Назад</a></p>
</body>
</html>
