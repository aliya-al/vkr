<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Категории</title>
</head>
<body>
  <h1>Категории</h1>
  <p><a href="/admin/dashboard">На главную</a> | <a href="/admin/categories/new">Создать категорию</a></p>
  <table border="1" cellpadding="6">
    <thead>
      <tr>
        <th>Название</th>
        <th>Slug</th>
        <th>Родитель</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody>
      {% for category in categories %}
        <tr>
          <td>{{ category.name }}</td>
          <td>{{ category.slug }}</td>
          <td>{% if category.parent %}{{ category.parent.name }}{% else %}-{% endif %}</td>
          <td>
            <a href="/admin/categories/{{ category.id }}/edit">Редактировать</a>
            <form method="post" action="/admin/categories/{{ category.id }}/delete" style="display:inline;">
              <button type="submit">Удалить</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="4">Категорий пока нет.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
