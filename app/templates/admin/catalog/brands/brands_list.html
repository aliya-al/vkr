<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Бренды</title>
</head>
<body>
  <h1>Бренды</h1>
  <p><a href="/admin/">На главную</a> | <a href="/admin/catalog/brands/create">Создать бренд</a></p>
  <table border="1" cellpadding="6">
    <thead>
      <tr>
        <th>Название</th>
        <th>Slug</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody>
      {% for brand in brands %}
        <tr>
          <td>{{ brand.name }}</td>
          <td>{{ brand.slug }}</td>
          <td>
            <a href="/admin/catalog/brands/{{ brand.id }}/edit">Редактировать</a>
            <form method="post" action="/admin/catalog/brands/{{ brand.id }}/delete" style="display:inline;">
              <button type="submit">Удалить</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="3">Брендов пока нет.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
