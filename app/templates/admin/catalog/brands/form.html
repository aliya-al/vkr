<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
</head>
<body>
  <h1>{{ title }}</h1>
  <p><a href="/admin/brands">Назад к списку</a></p>
  <form method="post" action="{{ action_url }}">
    <div>
      <label>Название</label><br>
      <input name="name" value="{{ brand.name if brand else '' }}" required>
    </div>
    <div style="margin-top:8px;">
      <label>Slug</label><br>
      <input name="slug" value="{{ brand.slug if brand else '' }}" required>
    </div>
    <div style="margin-top:12px;">
      <button type="submit">Сохранить</button>
    </div>
  </form>
</body>
</html>
