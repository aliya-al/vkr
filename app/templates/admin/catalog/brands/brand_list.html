<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Бренды</title>
</head>
<body>
  <h1>Бренды</h1>
  <a href="/admin/brands/new">Создать бренд</a>
  <table border="1" cellpadding="4">
    <thead>
      <tr>
        <th>Название</th>
        <th>Slug</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody>
    {% for brand in brands %}
      <tr>
        <td>{{ brand.name }}</td>
        <td>{{ brand.slug }}</td>
        <td>
          <a href="/admin/brands/{{ brand.id }}/edit">Редактировать</a>
          <form method="post" action="/admin/brands/{{ brand.id }}/delete" style="display:inline;">
            <button type="submit">Удалить</button>
          </form>
        </td>
      </tr>
    {% endfor %}
    </tbody>
  </table>
  <p><a href="/admin/dashboard">Назад</a></p>
</body>
</html>
