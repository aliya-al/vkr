<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Редактировать бренд</title>
</head>
<body>
  <h1>Редактировать бренд</h1>
  <p><a href="/admin/catalog/brands">Назад к списку</a></p>
  <form method="post" action="/admin/catalog/brands/{{ brand.id }}/edit">
    <div>
      <label>Название</label><br>
      <input name="name" value="{{ brand.name }}" required>
    </div>
    <div style="margin-top:12px;">
      <button type="submit">Сохранить</button>
    </div>
  </form>
</body>
</html>
