<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Создать товар</title>
</head>
<body>
  <h1>Создать товар</h1>
  <form method="post" action="/admin/products/new">
    <div>
      <label>Название
        <input type="text" name="name" required>
      </label>
    </div>
    <div>
      <label>Описание
        <textarea name="description"></textarea>
      </label>
    </div>
    <div>
      <label>Категория
        <select name="category_id" required>
          {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <div>
      <label>Бренд
        <select name="brand_id">
          <option value="">(нет)</option>
          {% for brand in brands %}
            <option value="{{ brand.id }}">{{ brand.name }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <div>
      <label>Цена
        <input type="number" name="price" min="0" step="1" required>
      </label>
    </div>
    <div>
      <label>Объем, м³
        <input type="number" name="volume_m3" min="0" step="0.01" required>
      </label>
    </div>
    <div>
      <label>Вес, кг
        <input type="number" name="weight_kg" min="0" step="0.01" required>
      </label>
    </div>
    <div>
      <label>Скидка, %
        <input type="number" name="discount_percent" min="0" max="100" step="1">
      </label>
    </div>
    <div>
      <label>
        <input type="checkbox" name="is_active" value="true" checked> Активен
      </label>
    </div>
    <button type="submit">Сохранить</button>
  </form>
  <p><a href="/admin/products">Назад</a></p>
</body>
</html>
