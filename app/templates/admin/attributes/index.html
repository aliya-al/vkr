<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Характеристики</title>
</head>
<body>
  <h1>Характеристики</h1>

  <p>
    <a href="/admin/dashboard">На главную</a> |
    <a href="/admin/attributes/new">Создать характеристику</a>
  </p>

  <table border="1" cellpadding="6">
    <thead>
      <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Slug</th>
        <th>Тип</th>
        <th>Ед.</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody>
      {% for a in attributes %}
        <tr>
          <td>{{ a.id }}</td>
          <td>{{ a.name }}</td>
          <td>{{ a.slug }}</td>
          <td>{{ a.value_type }}</td>
          <td>{{ a.unit or '-' }}</td>
          <td>
            <a href="/admin/attributes/{{ a.id }}/edit">Редактировать</a>
            <form method="post" action="/admin/attributes/{{ a.id }}/delete" style="display:inline;">
              <button type="submit">Удалить</button>
            </form>
          </td>
        </tr>
      {% else %}
        <tr><td colspan="6">Характеристик пока нет.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
