<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Редактировать товар</title>
</head>
<body>
  <h1>Редактировать товар</h1>

  <form method="post" action="/admin/products/{{ product.id }}/edit" enctype="multipart/form-data">
    <div>
      <label>Название
        <input type="text" name="name" value="{{ product.name }}" required>
      </label>
    </div>

    <div>
      <label>Описание
        <textarea name="description">{{ product.description or '' }}</textarea>
      </label>
    </div>

    <div>
      <label>Категория
        <select name="category_id" required>
          {% for category in categories %}
            <option value="{{ category.id }}" {% if product.category_id == category.id %}selected{% endif %}>{{ category.name }}</option>
          {% endfor %}
        </select>
      </label>
    </div>

    <div>
      <label>Бренд
        <select name="brand_id">
          <option value="">(нет)</option>
          {% for brand in brands %}
            <option value="{{ brand.id }}" {% if product.brand_id == brand.id %}selected{% endif %}>{{ brand.name }}</option>
          {% endfor %}
        </select>
      </label>
    </div>

    <div>
      <label>Цена
        <input type="number" name="price" min="0" step="1" value="{{ product.price }}" required>
      </label>
    </div>

    <div>
      <label>Объем, м³
        <input type="number" name="volume_m3" min="0" step="0.01" value="{{ product.volume_m3 }}" required>
      </label>
    </div>

    <div>
      <label>Вес, кг
        <input type="number" name="weight_kg" min="0" step="0.01" value="{{ product.weight_kg }}" required>
      </label>
    </div>

    <div>
      <label>Скидка, %
        <input type="number" name="discount_percent" min="0" max="100" step="1"
               value="{{ product.discount_percent if product.discount_percent is not none else '' }}">
      </label>
    </div>

    <div>
      <label>
        <input type="checkbox" name="is_active" value="true" {% if product.is_active %}checked{% endif %}> Активен
      </label>
    </div>

    <hr>

    <h3>Фотографии</h3>

    {% set imgs = (product.images or []) %}
    {% if imgs %}
      <p>Главное фото выбирается radio-кнопкой. Удалять главное нельзя.</p>

      {% for img in imgs %}
        <div style="border:1px solid #ccc; padding:8px; margin:8px 0;">
          <div>
            <label>
              <input type="radio" name="set_main_id" value="{{ img.id }}" {% if img.is_main %}checked{% endif %}>
              Главное
            </label>
          </div>

          <div>
            <img src="{{ img.file_path }}" alt="photo" style="max-width:200px; height:auto;">
          </div>

          <div>
            <label>Заменить это фото:
              <input type="file" name="replace_{{ img.id }}" accept="image/*">
            </label>
          </div>

          <div>
            <label>
              <input type="checkbox" name="remove_{{ img.id }}" value="true">
              Удалить
            </label>
          </div>

        </div>
      {% endfor %}
    {% else %}
      <p><strong>У товара нет фото.</strong> Загрузите главное:</p>
      <div>
        <label>Главное фото
          <input type="file" name="main_image_fallback" accept="image/*" required>
        </label>
      </div>
    {% endif %}

    <div>
      <label>Добавить новые фото (0..N)
        <input type="file" name="new_images" accept="image/*" multiple>
      </label>
    </div>

    <button type="submit">Сохранить</button>
  </form>

  <p><a href="/admin/products">Назад</a></p>
</body>
</html>
